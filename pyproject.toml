[project]
name = "wshtlib"
version = "0.5.0"
description = "Structured logging, EMF metrics, and request context for AWS Lambda"
readme = "README.md"
authors = [{ name = "Wholeshoot" }]
license = { text = "MIT" }
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
fastapi = ["starlette>=1.3.1"]

[project.urls]
Homepage = "https://github.com/polsen/wshtlib"
Repository = "https://github.com/polsen/wshtlib"

[dependency-groups]
dev = [
  "pytest",
  "pytest-cov",
  "pytest-asyncio",
  "black",
  "ruff",
  "mypy",
  "starlette>=1.3.1",
  "httpx",
  "boto3-stubs[secretsmanager]",
  "jsonschema",
  "types-jsonschema",
  "zizmor",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wshtlib"]

[tool.black]
line-length = 88
# Pinned so formatting does not shift with the interpreter CI happens to run.
target-version = ["py313"]

[tool.isort]
profile = "black"

[tool.ruff.lint]
# S is flake8-bandit: the same checks bandit makes, run in the linter that
# already gates CI, so they cannot be forgotten between audits.
select = ["E", "F", "I", "DTZ", "S"]

[tool.ruff.lint.per-file-ignores]
# S101 is "assert used", which is what a test is made of.
"tests/**" = ["S101"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.coverage.report]
fail_under = 90
