[project]
name = "wshtlib"
version = "0.1.0"
description = "Shared runtime library for Wholeshoot services"
authors = [{ name = "Wholeshoot" }]
license = { text = "MIT" }
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
fastapi = ["starlette>=0.27"]

[project.urls]
Homepage = "https://github.com/polsen/wshtlib"
Repository = "https://github.com/polsen/wshtlib"

[dependency-groups]
dev = [
  "pytest",
  "pytest-cov",
  "pytest-asyncio",
  "black",
  "ruff",
  "mypy",
  "starlette>=0.27",
  "httpx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wshtlib"]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"

[tool.ruff.lint]
select = ["E", "F", "I", "DTZ"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.coverage.report]
fail_under = 90
