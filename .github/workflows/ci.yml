name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Supersede an in-flight run for the same ref, except on a tag: cancelling a
# release part-way through could leave a half-published version.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  test:
    name: Test and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Otherwise the job's token stays in .git/config, where anything
          # that later uploads the workspace as an artifact carries it out.
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          # A cache entry is attacker-reachable state, and this workflow also
          # publishes. The dependency set is small enough that caching it buys
          # less than the class of attack it opens.
          enable-cache: false
      - run: uv sync --group dev
      - run: uv run pytest
      - run: uv run mypy wshtlib
      - run: uv run ruff check wshtlib
      - run: uv run black --check wshtlib tests
      - name: Audit workflows
        run: uv run zizmor --no-progress .github/workflows/

  publish:
    name: Publish to PyPI
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Mints the short-lived OIDC token PyPI trusted publishing exchanges for
      # an upload credential, so no long-lived API token exists to leak.
      id-token: write # for PyPI trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          # Nothing cached may influence an artefact that goes to PyPI.
          enable-cache: false
      # PyPI uploads are immutable, so a tag that disagrees with the packaged
      # version ships the wrong artefact permanently. Fail before building.
      - name: Verify tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(python3 -c 'import tomllib,pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject.toml version $pkg"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches version $pkg"
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
